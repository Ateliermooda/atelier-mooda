<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Atelier Mooda</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f3ec;
      color: #2c2925;
    }

    .page {
      min-height: 100vh;
    }

    header {
      padding: 28px 7%;
      border-bottom: 1px solid rgba(44, 41, 37, 0.12);
    }

    .logo {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: lowercase;
    }

    main {
      padding: 25px 7% 20px;
    }

    .hero {
      display: grid;
      grid-template-columns: 0.95fr 1.05fr;
      gap: 50px;
      align-items: stretch;
    }

    .text-block {
      display: grid;
      grid-template-rows: auto 1fr;
      max-width: 500px;
      height: 100%;
      padding-top: 10px;
    }

    .kicker {
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #6b6258;
    }

    .message {
      align-self: center;
      padding-bottom: 20px;
    }

    h1 {
      margin: 0 0 24px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(34px, 3vw, 36px);
      line-height: 1.15;
      font-style: italic;
      font-weight: 400;
      letter-spacing: 0.01em;
    }

    .secondary {
      margin: 0;
      font-size: 18px;
      line-height: 1.7;
      color: #5a5249;
    }

    .visual img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 2px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
    }

    footer {
      padding: 22px 7%;
      border-top: 1px solid rgba(44, 41, 37, 0.12);
      font-size: 13px;
      color: #6b6258;
    }

    @media (max-width: 900px) {
      main {
        padding-top: 40px;
      }

      .hero {
        grid-template-columns: 1fr;
      }

      .text-block {
        display: block;
        max-width: 100%;
      }

      .kicker {
        margin-bottom: 45px;
      }

      .message {
        padding-bottom: 0;
      }

      h1 {
        font-size: 34px;
      }

      .secondary {
        margin-bottom: 35px;
        font-size: 17px;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <header>
      <div class="logo">atelier mooda</div>
    </header>

    <main>
      <section class="hero">

        <div class="text-block">

          <div class="kicker">
            Packaging · Édition · Identité visuelle
          </div>

          <div class="message">
            <h1>
              Vos œuvres préférées transformées en collection.
            </h1>

            <p class="secondary">
              Vos enveloppes, carnets, mugs, presse-papiers, coffrets et boîtes
              à votre image. Votre univers à portée de main.
            </p>
          </div>

        </div>

        <div class="visual">
          <img
            src="terra-atelier.png"
            alt="Collection graphique inspirée d’un vase"
          >
        </div>

      </section>
    </main>

    <footer>
      Atelier Mooda · créations graphiques à partir de vos inspirations
    </footer>

  </div>
</body>
</html>
