<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atelier Mooda</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f3ec;
      color: #2c2925;
    }

    .page {
      min-height: 100vh;
    }

    header {
      padding: 8px 7%;
      border-bottom: 1px solid rgba(44, 41, 37, 0.12);
    }

    .logo {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: lowercase;
    }

    main {
      padding: 25px 7% 20px;
    }

    .hero {
      display: grid;
      grid-template-columns: 0.95fr 1.05fr;
      gap: 50px;
      align-items: start;
    }

    .text-block {
      padding-top: 10px;
      max-width: 500px;
    }

    .kicker {
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 22px;
      color: #6b6258;
    }

    h1 {
      margin: 200px 15px 24px 0;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(34px, 4vw, 36px);
      line-height: 1.15;
      font-style: italic;
      font-weight: 400;
      letter-spacing: 0.01em;
    }

    .intro {
      font-size: 22px;
      line-height: 1.6;
      margin: 0 0 30px 0;
      color: #3a342e;
    }

    .secondary {
      font-size: 18px;
      line-height: 1.7;
      margin: 0;
      color: #5a5249;
    }

    .visual img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 2px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }

    footer {
      padding: 22px 7%;
      border-top: 1px solid rgba(44, 41, 37, 0.12);
      font-size: 13px;
      color: #6b6258;
    }

    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
      }

      .text-block {
        max-width: 100%;
      }

      .intro {
        font-size: 20px;
      }

      .secondary {
        font-size: 17px;
      }

      main {
        padding-top: 70px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="logo">atelier mooda</div>
    </header>

    <main>
      <section class="hero">
        <div class="text-block">
          <div class="kicker">Packaging · Édition · Identité visuelle</div>

          <h1>Vos œuvres préférées transformées en collection.</h1>

          <p class="secondary">
            Vos enveloppes, carnets, mugs, presse-papiers, coffrets et boîtes
            à votre image. Votre univers à portée de main.
          </p>
        </div>

        <div class="visual">
          <img src="terra-atelier.png" alt="Collection graphique inspirée d’un vase">
        </div>
      </section>
    </main>

    <footer>
      Atelier Mooda · créations graphiques à partir de vos inspirations
    </footer>
  </div>
</body>
</html>
